[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "ha-plant-monitor-ble"
version = "2.0.0"
description = "Home Assistant custom integration for a three-zone BLE plant monitor"
readme = "README.md"
requires-python = ">=3.13"
license = "MIT"
dependencies = []

[project.optional-dependencies]
test = [
  "homeassistant",
  "pytest",
  "pytest-homeassistant-custom-component",
  "pytest-cov",
  "ruff"
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
target-version = "py313"
line-length = 88

[tool.ruff.lint]
select = ["ALL"]
ignore = [
  "ANN401",
  "COM812",
  "CPY001",
  "D203",
  "D213",
  "FBT003",
  "UP017",
  "UP040"
]

[tool.ruff.lint.per-file-ignores]
"custom_components/plant_monitor_ble/__init__.py" = ["PLC0415", "TC001"]
"tests/*" = ["ANN", "D", "E402", "PLR2004", "S101"]
